name: Feature request
description: Suggest an improvement or new capability
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case. What can't you do today that you wish you could?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How might this look from a user's perspective? CLI flags, config syntax, output format, etc.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you didn't pick them.

  - type: dropdown
    id: roadmap
    attributes:
      label: Does this fit the existing roadmap?
      description: See ROADMAP.md
      options:
        - "Yes — fits a planned version"
        - "No — but it's a small addition"
        - "No — it's a significant new direction"
        - "Not sure"
    validations:
      required: true
